[project]
name = "lucebox-lsa"
version = "0.1.0"
description = "Dataset and compact query-encoder tooling for Lucebox LSA"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lsa"]
package-dir = {lsa = "."}
