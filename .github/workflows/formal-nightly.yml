name: Formal Verification Nightly (advisory)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-nightly
  cancel-in-progress: true

jobs:
  verify-nightly:
    name: verify-nightly-advisory
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        name: Generate extended base-approved plan
        continue-on-error: true
        env:
          VERIFIER_IMAGE: ghcr.io/dusterbloom/lucebox-esbmc-ai-verifier@sha256:9321a4aa371efec1b55e33dff0c1cefbc10778aa7f38b07cb2b84cff1c9ed39e
          REVISION: ${{ github.sha }}
        run: |
          policy_image="$(
            git show "$REVISION:formal/contracts/registry.toml" |
              python3 -c '
          import sys
          import tomllib
          print(tomllib.loads(sys.stdin.read())["toolchain"]["verifier_image"])
          '
          )"
          if [[ "$policy_image" != "$VERIFIER_IMAGE" ]]; then
            echo "Nightly verifier image does not match trusted policy." >&2
            exit 13
          fi
          mkdir -p .formal-plan
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 1 \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/.formal-plan:/plan:rw" \
            --workdir /workspace \
            "$VERIFIER_IMAGE" plan \
            --workspace /workspace \
            --base-policy formal/contracts/registry.toml \
            --base-sha "$REVISION" \
            --head-sha "$REVISION" \
            --mode nightly \
            --out /plan

      - id: scope
        name: Confirm the three-target nightly scope
        if: steps.plan.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -c '
          import json
          from pathlib import Path

          plan = json.loads(Path(".formal-plan/plan.json").read_text())
          actual = [target["id"] for target in plan["targets"]]
          expected = [
              "prefix-cache-inline",
              "prefix-cache-abort-hole",
              "prefix-cache-full-lifecycle",
          ]
          if actual != expected:
              raise SystemExit(f"unexpected nightly targets: {actual!r}")
          '

      - id: formal
        name: Run extended generated contracts
        if: >-
          steps.plan.outcome == 'success' &&
          steps.scope.outcome == 'success'
        continue-on-error: true
        env:
          VERIFIER_IMAGE: ghcr.io/dusterbloom/lucebox-esbmc-ai-verifier@sha256:9321a4aa371efec1b55e33dff0c1cefbc10778aa7f38b07cb2b84cff1c9ed39e
        run: |
          mkdir -p .formal-results
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --memory 6g \
            --cpus 2 \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/.formal-plan:/plan:ro" \
            --volume "$GITHUB_WORKSPACE/.formal-results:/results:rw" \
            --workdir /workspace \
            "$VERIFIER_IMAGE" verify \
            --plan /plan/plan.json \
            --workspace /workspace \
            --generated-root /plan \
            --out /results

      - id: legacy
        name: Run legacy nightly capsules for comparison
        continue-on-error: true
        env:
          VERIFIER_IMAGE: ghcr.io/dusterbloom/lucebox-esbmc-ai-verifier@sha256:9321a4aa371efec1b55e33dff0c1cefbc10778aa7f38b07cb2b84cff1c9ed39e
        run: |
          mkdir -p .formal-legacy-results
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --memory 6g \
            --cpus 2 \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/.formal-legacy-results:/results:rw" \
            --workdir /workspace \
            "$VERIFIER_IMAGE" verify \
            --manifest /workspace/formal/manifest.toml \
            --mode nightly \
            --out /results

      - name: Publish advisory formal summary
        if: always()
        run: |
          if [[ -f .formal-results/summary.md ]]; then
            cat .formal-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nightly plan did not produce a verification summary." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            echo "This nightly soak is advisory and is not merge policy."
            echo "Planner outcome: \`${{ steps.plan.outcome }}\`"
            echo "Scope outcome: \`${{ steps.scope.outcome }}\`"
            echo "Verifier outcome: \`${{ steps.formal.outcome }}\`"
            echo "Legacy comparison: \`${{ steps.legacy.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record nightly source
        if: always()
        env:
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .formal-results
          python3 -c '
          import json
          import os
          from pathlib import Path

          source = {
              "event": os.environ["GITHUB_EVENT_NAME"],
              "repository": os.environ["REPOSITORY"],
              "revision": os.environ["REVISION"],
          }
          Path(".formal-results/source.json").write_text(
              json.dumps(source, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: formal-nightly-results
          path: |
            .formal-plan/
            .formal-results/
            .formal-legacy-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  mutation-sensitivity:
    name: mutation-sensitivity-advisory
    needs: verify-nightly
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: mutation
        name: Require the lifecycle mutations to fail
        continue-on-error: true
        run: |
          mkdir -p .formal-mutation-results
          scripts/formal_mutation_test.sh 2>&1 |
            tee .formal-mutation-results/output.log

      - name: Publish advisory mutation summary
        if: always()
        run: |
          {
            echo "# Formal mutation sensitivity"
            echo
            echo "This nightly soak is advisory and is not merge policy."
            echo "Mutation outcome: \`${{ steps.mutation.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: formal-nightly-mutation-results
          path: .formal-mutation-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
